# Builds and tests every pull request on Windows and macOS (Apple Silicon and
# Intel), the same targets Release builds, so a PR can't break the release.

name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Tests run natively: macos-latest is Apple Silicon, so the Intel build is
      # compiled but not run.
      - name: Test
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --locked --target ${{ matrix.target }}
