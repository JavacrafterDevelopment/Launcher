# When main gets a Cargo.toml version that has no tag yet (a merged PR that bumped
# it), tags that commit v<version> and starts the Release workflow for the tag, so
# merging a version bump is all a release takes.

name: Tag on merge

on:
  push:
    branches: [main]
    paths: ['Cargo.toml']

concurrency: tag-on-merge

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag the new version and start the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          tag="v$ver"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to do."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" -m "Launcher $ver" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          gh workflow run release.yml --ref "$tag"
          echo "Tagged $tag and started the Release workflow."
