# Publishes a release whenever a version tag is pushed:
#
#   1. bump `version` in Cargo.toml (e.g. 0.2.0) and commit
#   2. git tag v0.2.0 && git push origin main v0.2.0
#
# The MSVC build links the C runtime and the WebView2 loader statically, so the
# exe needs nothing installed. tools/package.ps1 then packs the program folder
# (the exe plus anything in package/) with a manifest of SHA-256 hashes.
# Launchers already out there see the new release on their next start (or from
# Settings > Check for updates) and replace themselves with it.

name: Release

on:
  push:
    tags: ['v*']

# One release at a time, so two tags pushed together can't race on update.json.
concurrency: release

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($tag -ne $ver) { throw "Tag v$tag doesn't match Cargo.toml version $ver" }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: ./tools/package.ps1 -Exe target/x86_64-pc-windows-msvc/release/Launcher.exe -Out dist

      # Launcher-windows-x64.zip is what launchers update from: every file in the
      # folder, listed with its SHA-256 in launcher-manifest.json. Launcher.exe is
      # also attached, for people who just want the exe and for 0.1.0, whose
      # updater only knew how to fetch the exe.
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $pre = if ($tag -match '-') { '--prerelease' } else { $null }
          gh release create $tag dist/Launcher-windows-x64.zip dist/Launcher/Launcher.exe `
            --title "Launcher $($tag.TrimStart('v'))" --generate-notes $pre

      # update.json is what launchers check first: served from raw.githubusercontent.com,
      # so it isn't subject to the GitHub API's 60-an-hour limit. It lives on its own
      # `updates` branch so releases never add commits to main.
      - name: Publish update.json
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag  = '${{ github.ref_name }}'
          $repo = '${{ github.repository }}'
          $info = gh release view $tag --json body,publishedAt,isPrerelease | ConvertFrom-Json

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if (git ls-remote --heads origin updates) {
            git fetch --depth 1 origin updates
            git worktree add updates-branch FETCH_HEAD
          } else {
            # First release with update.json: start the branch with nothing else on it.
            git worktree add --detach updates-branch
            git -C updates-branch checkout --orphan updates
            git -C updates-branch rm -rf --quiet .
          }

          ./tools/publish-update.ps1 -Entry dist/release-entry.json -Repo $repo -Tag $tag `
            -UpdateJson updates-branch/update.json -Prerelease:$info.isPrerelease `
            -Notes "$($info.body)" -Published "$($info.publishedAt)"

          git -C updates-branch add update.json
          git -C updates-branch commit -m "update.json for $tag"
          git -C updates-branch push origin HEAD:refs/heads/updates
