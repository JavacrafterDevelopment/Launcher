[package]
name = "launcher"
version = "0.2.6"
edition = "2021"
description = "Portable launcher for Javacrafter apps and games, updated from GitHub releases."
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "Launcher"
path = "src/main.rs"

[dependencies]
tao = "0.37"
wry = "0.57"
# Native TLS is SChannel on Windows: the OS trust store, no C compiler, no bundled roots.
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
# Pure-Rust deflate (zlib-rs): no C compiler needed for the GNU build.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
